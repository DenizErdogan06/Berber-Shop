<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" type="text/css" href="/assets/css/takvim.css" />
  </head>

  <body>
    <div class="container">
      <div class="calendar">
        <div class="header">
          <div class="month">July 2021</div>
          <div class="btns">
            <!-- today -->
            <div class="btn today">
              <i class="fas fa-calendar-day"></i>
            </div>
            <!-- previous month -->
            <div class="btn prev">
              <i class="fas fa-chevron-left"></i>
            </div>
            <!-- next month -->
            <div class="btn next">
              <i class="fas fa-chevron-right"></i>
            </div>
          </div>
        </div>
        <div class="weekdays">
          <div class="day">Sun</div>
          <div class="day">Mon</div>
          <div class="day">Tue</div>
          <div class="day">Wed</div>
          <div class="day">Thu</div>
          <div class="day">Fri</div>
          <div class="day">Sat</div>
        </div>
        <div class="days">
          <!-- render days with js -->
          <script type="text/javascript" src="/assets/js/takvim.js"></script>
        </div>
      </div>
    </div>

    <div class="credits">
      <a href="https://www.youtube.com/channel/UCiUtBDVaSmMGKxg1HYeK-BQ">
        Created with <span><i class="fas fa-heart"></i></span> by
        <span>Open Source Coding</span>
      </a>
    </div>
  </body>
</html>
